{% if is_paginated %}<nav class="mt-4"><ul class="pagination justify-content-center"><li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}"><a class="page-link" href="?{{ request.GET.urlencode }}{% if request.GET %}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a></li><li class="page-item active"><span class="page-link">{{ page_obj.number }} / {{ paginator.num_pages }}</span></li><li class="page-item {% if not page_obj.has_next %}disabled{% endif %}"><a class="page-link" href="?{{ request.GET.urlencode }}{% if request.GET %}&{% endif %}page={{ page_obj.next_page_number }}">Próxima</a></li></ul></nav>{% endif %}
